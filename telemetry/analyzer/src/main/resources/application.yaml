spring:
  application:
    name: analyzer
  datasource:
    url: jdbc:postgresql://localhost:5432/telemetry_analyzer
    username: dbuser
    password: 12345
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

kafka:
  bootstrap-servers: localhost:9092
  topics:
    hubs: telemetry.hubs.v1
    snapshots: telemetry.snapshots.v1
  consumer:
    snapshot:
      group-id: telemetry.analyzer.snapshot
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: ru.yandex.practicum.kafka.deserializer.SensorsSnapshotDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
      max-poll-records: 100
    hub:
      group-id: telemetry.analyzer.hub
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: ru.yandex.practicum.kafka.deserializer.HubEventDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
      max-poll-records: 100

grpc:
  client:
    hub-router:
      address: 'static://localhost:59090'
      enableKeepAlive: true
      keepAliveWithoutCalls: true
      negotiationType: plaintext