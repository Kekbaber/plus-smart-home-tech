spring:
  application:
    name: aggregator
kafka:
  bootstrap-servers: localhost:9092
  topics:
    sensors: telemetry.sensors.v1
    snapshots: telemetry.snapshots.v1
  consumer:
    group-id: telemetry.aggregator
    key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    value-deserializer: ru.yandex.practicum.kafka.deserializer.SensorEventDeserializer
    auto-offset-reset: earliest
    enable-auto-commit: false
  producer:
    key-serializer: org.apache.kafka.common.serialization.StringSerializer
    value-serializer: ru.yandex.practicum.kafka.serializer.BaseAvroSerializer
    acks: all
    enable-idempotence: true